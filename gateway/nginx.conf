# Local stand-in for the AWS API Gateway + load balancer: one URL, routed by path to each service.
server {
    listen 8080;
    client_max_body_size 1m;

    location /v1/compliance/ { proxy_pass http://compliance-service:8080; }
    location /v1/depletions/ { proxy_pass http://compliance-service:8080; }
    location /v1/inventory   { proxy_pass http://inventory-allocator:8080; }
    location /               { proxy_pass http://order-api:8080; }
}
