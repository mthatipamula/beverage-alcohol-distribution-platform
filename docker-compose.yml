# Local stack: Kafka (KRaft), PostgreSQL, the three services, the web app and a gateway on http://localhost:8090.
name: bevdist

x-service-env: &service-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: bevdist
  DB_USER: bevdist
  DB_PASSWORD: bevdist
  KAFKA_BROKERS: kafka:19092
  AUTH_MODE: api-key
  SEED_DEMO_DATA: "true"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bevdist
      POSTGRES_USER: bevdist
      POSTGRES_PASSWORD: bevdist
    ports: ["5436:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bevdist -d bevdist"]
      interval: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created by order-api at startup
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  order-api:
    build: ./services/order-api
    environment:
      <<: *service-env
      KAFKA_TOPIC_PARTITIONS: "3"
      KAFKA_REPLICATION_FACTOR: "1"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 3s
      retries: 40
    restart: unless-stopped

  compliance-service:
    build: ./services/compliance-service
    environment:
      <<: *service-env
      FEEDS_DIR: /data/feeds
    ports: ["8091:8080"]           # direct access for its OpenAPI docs at /docs
    volumes: ["./data/feeds:/data/feeds"]
    depends_on:
      order-api: { condition: service_healthy }   # order-api creates the Kafka topics
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 3s
      retries: 40
    restart: unless-stopped

  inventory-allocator:
    build: ./services/inventory-allocator
    environment:
      <<: *service-env
      RUST_LOG: info
    depends_on:
      order-api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: ./web
    environment:
      AUTH_MODE: api-key
      BRAND_NAME: BevDist Wholesale

  gateway:
    image: nginx:1.27-alpine
    ports: ["8090:8080"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [order-api, compliance-service, inventory-allocator, web]

  # Optional Kafka browser: ./scripts/dev.sh start --ui  (http://localhost:8095)
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [ui]
    ports: ["8095:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

volumes:
  pgdata:
  kafkadata:
